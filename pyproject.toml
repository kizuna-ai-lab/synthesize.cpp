[build-system]
requires = ["scikit-build-core==1.0.3"]
build-backend = "scikit_build_core.build"

[project]
name = "synthesize-cpp-native"
dynamic = ["version"]
description = "Default native runtime Provider for synthesize-cpp"
readme = "bindings/python-native/README.md"
requires-python = ">=3.11"
license-files = ["THIRD_PARTY_NOTICES.md", "ggml/LICENSE"]

[project.entry-points."synthesize_cpp.native"]
default = "synthesize_cpp_native:descriptor"

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "include/synthesize.h"
regex = '(?sx) SYNTH_VERSION_MAJOR \s+ (?P<major>\d+) .*? SYNTH_VERSION_MINOR \s+ (?P<minor>\d+) .*? SYNTH_VERSION_PATCH \s+ (?P<patch>\d+)'
result = "{major}.{minor}.{patch}"

[tool.scikit-build]
build-dir = "build/python-provider/default/{wheel_tag}"
cmake.version = ">=3.24"
ninja.version = "==1.13.0"
wheel.py-api = "py3"
wheel.install-dir = "synthesize_cpp_native"
wheel.packages = ["bindings/python-native/synthesize_cpp_native"]
install.components = ["wheel"]
cmake.args = [
  "-DSYNTH_BUILD_PYTHON_PROVIDER=ON",
  "-DSYNTH_PYTHON_PROVIDER_ID=default",
  "-DSYNTH_BUILD_SHARED=ON",
  "-DSYNTH_GGML_BACKEND_DL=ON",
  "-DSYNTH_BUILD_CLI=OFF",
  "-DSYNTH_BUILD_TESTS=OFF",
  "-DSYNTH_BUILD_PYTHON_TESTS=OFF",
  "-DSYNTH_BUILD_INTEGRATION_TESTS=OFF",
  "-DSYNTH_CUDA=OFF",
  "-DSYNTH_VULKAN=OFF",
  "-DGGML_NATIVE=OFF",
]
sdist.exclude = [
  "/models/",
  "/reports/",
  "/build*/",
  "/cmake-build*/",
  "/.idea/",
  "/.github/",
  "**/__pycache__/",
  "**/.venv/",
]

[tool.uv]
package = false
