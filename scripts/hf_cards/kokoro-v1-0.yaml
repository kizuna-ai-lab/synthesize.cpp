summary: |
  A self-contained Kokoro inference package converted from the official
  Kokoro-82M v1.0 checkpoint. It is a StyleTTS 2 decoder with an iSTFTNet
  generator, runs on CPU and CUDA through the same public library interface,
  and carries all 54 preset Voices. The model is language-blind: it consumes
  IPA phoneme token IDs and a style vector, so the Text Frontend is the
  caller's concern rather than the package's.

capabilities:
  sample_rate_hz: 24000
  voice_count: 54
  voice_ids: preset-catalog
  voice_mode: preset_catalog
  input_kinds:
    - phonemes_utf8
    - token_ids
  frontend_provider: synthesize.symbol_map

validation:
  level: port_validated
  # Two different claims. `quality_evaluation` is the automated grid ADR 0017
  # defers -- no WER, no speaker similarity, no corpus -- and it has not run.
  # `listening_audit` is one maintainer checking a small set for obvious
  # regressions, which happened on 2026-07-26 and had no way to be reported until
  # the generator grew a field for it. Neither moves the Validation Level.
  quality_evaluation: not_run
  listening_audit: no_obvious_regression
  listening_audit_detail:
    listeners: 1
    cases: 8 of 15
    profiles: [F32, F16, Q8_MIXED]
    backends: [CPU, CUDA]
    date: 2026-07-26
    method: >-
      A comparison page switching between the pinned PyTorch reference and this
      port mid-playback at the same offset, so the same instant is heard twice.
  date: 2026-07-26
  reference: the pinned upstream PyTorch implementation
  implementation_revision: workspace-snapshot-2026-07-26
  cases_per_stage: 15
  stages: 7
  # Set explicitly 2026-08-20 (Task 8 fix round, Stage 3 Plan 3):
  # duration.pred_dur, duration.y_length and duration.alignment are gated
  # exact probes in this family's own Golden suite (docs/porting/families/
  # kokoro.md's shapes table), so every replayed case's frame count and
  # alignment structure matches the oracle exactly.
  replay_duration_exact: true
  columns:
    - key: cpu_pcm_correlation
      title: CPU waveform correlation
    - key: dgx_pcm_correlation
      title: DGX Spark CUDA waveform correlation
  metric_note: |
    Correlation is the honest measure for this family rather than a sample-wise
    drift. Kokoro's excitation is a sine whose phase accumulates across the whole
    utterance, so a difference in F0 of a few parts in ten thousand becomes
    radians of phase by the last syllable: the waveforms diverge by construction
    while the speech does not. The figure quoted is the worst case over the
    suite. What is bit-exact, on every profile and both backends, is the
    predicted durations.
  # Set explicitly 2026-08-12. This card inherited the generator's old `full`
  # default and so asserted "CUDA placement contained zero executable CPU
  # fallback nodes" -- a sentence no measurement in this repository supports for
  # this family. Kokoro's hold decision is thoroughly measured (18 of 21 CUDA
  # validation runs failed before it, 2,372 scheduler splits for the rejected
  # mechanism, 89.2 of 352.8 MB mirrored), but its per-stage node placement was
  # never counted: `log_placement_if_enabled` sits behind
  # SYNTH_DEBUG_BACKEND_PLACEMENT and no run was recorded, and none of the seven
  # validate-kokoro-*.py scripts reads placement. The note below therefore says
  # which stages are held and why, and stops where the evidence stops.
  cuda_placement: partial
  cuda_placement_note: >-
    Two of this package's seven stages run on CPU on every Execution Backend --
    the PL-BERT encoder with its `bert_encoder` projection, and the duration
    predictor -- and the other five run on CUDA when CUDA is the selected
    Execution Backend. `resolve_durations` rounds the
    predictor's logits to integer frame counts and every later stage's shape
    follows from that integer, so TF32's roughly 1e-3 relative error is enough
    to break the graph rather than perturb it: on the 146-token `kokoro-long`
    case one token's duration rounded from 1 to 2, moving the frame count from
    376 to 377, `prosody.en` to 241,280 elements against the oracle's 240,640,
    and 18 of 21 CUDA validation runs failed that way -- only three of them
    numerically. Holding the predictor alone was measured and found
    insufficient: with PL-BERT still on CUDA the logits stayed 8.8e-2 from the
    reference, so the whole path to the rounding is held. The cost is real: 89.2
    of the model's 352.8 MB are resident in both buffers and the longest case's
    wall time rises from 1.5 s to 2.9 s, still 3.2 times faster than real time,
    in exchange for durations, frame count and alignment being exact on all
    three profiles and all fifteen cases. How many individual graph nodes each
    stage places on CUDA has not been counted for this family, so this package
    makes no node-level placement claim in either direction.
  platforms:
    - DGX Spark CPU
    - NVIDIA GB10 CUDA 13.3

publication_note: |
  Both the source and the weights carry an explicit Apache-2.0 grant, so no
  redistribution assumption is required for this variant. The upstream model
  card lists CC BY training sources — Koniwa `tnc` and SIWIS — whose attribution
  is carried forward here.

  Only English is declared. The checkpoint also ships Voices for British
  English, Japanese, Mandarin Chinese, Spanish, French, Hindi, Italian and
  Brazilian Portuguese; those Voices load and run, but no language beyond `en`
  has its own validation cases, so none is advertised.

