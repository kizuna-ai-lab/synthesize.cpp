  # no copy -- so it is committed at scripts/licenses/LICENSE-meta-llama-3.txt
  # and copied beside the artifact by scripts/convert-omnivoice.py, which
  # digest-checks it against that committed copy's own hash. It was placed by
  # hand for the 2026-08-10 upload, before it had that owner.
  - filename: LICENSE-meta-llama-3.txt
    role: Meta Llama 3 Community License (required by the Boson agreement above, which is derived from it and defines itself to include it)
    size: "7.8 KB"
    size_bytes: 7801
    sha256: 475211637354ce4c14b9c3dacccbefbaba735fe1b0db97d6c4fd11cd1356819f

# Three profiles ship. All three carry a bit-identical codec half, so all three
# inherit the one exact-token claim that actually gates this family -- the
# cloning path's RVQ-encode grid. They do NOT inherit the greedy decode grid's
# oracle parity, which only F32 on CPU carries and which a quantized generator
# re-draws by design; what separates them is exactly how far that re-drawn
# rendering moves away from F32's. The `note` field
# is deliberately per-row rather than a paragraph under the table: a reader
# picking a file out of the download table has to see the caveat in the row they
# are picking, not two screens below it.
#
# No profile is faster. Measured against F32 on CUDA: Q8 -0.4%, F16 +2.7%
# *slower*; on CPU Q8 +1.5% slower, F16 -1.2%. The generator is compute-bound at
# roughly 205 MAC per weight byte, so a narrower weight does not relieve the
# bottleneck. Nothing on this card may say "faster" -- nor any synonym for it.
# The rule is about the claim, not the word: this prose once read "Q8 is 0.4%
# quicker" three lines under a sentence denying any speed benefit, which is the
# claim the rule forbids wearing a spelling the test did not enumerate. Report
# the four figures as signed deltas and leave it there.
quants:
  - name: F32
    filename: omnivoice-0-6b-F32.gguf
    size: "3190.0 MB"
    size_bytes: 3189953504
    sha256: f6d504ffaddcbf32f80f1f6c847f075bbd5d2c7b50fe95a194ceb635772f9fa3
    tensor_types: 798 F32
    note: >-
      The reference conversion, bit-for-bit from the upstream checkpoint. Take
      it to reproduce a measurement; otherwise F16 matches it on every measured
      case and is 1.2 GB smaller. 3506 MiB accelerator resident, 2.6 s to load.
    validation:
      cpu_pcm_cosine: 0.99999986
      cuda_pcm_cosine: 0.99999635
      ltas_max_db: "— (reference)"
  - name: F16
    filename: omnivoice-0-6b-F16.gguf
    size: "1964.9 MB"
    size_bytes: 1964929440
    sha256: 65c8cca59b350ccfdc6ad96c5a683b276f8c0fd5c8e96675d6dc110da3f52f70
    tensor_types: 599 F32 + 199 F16
    note: >-
      **Recommended default.** Same voice as F32 on every measured case, all
      three voice modes, 38.4% smaller. 2353 MiB accelerator resident, 1.6 s to
      load. Not faster than F32.
    validation:
      ltas_max_db: 2.87 dB
  - name: Q8
    filename: omnivoice-0-6b-Q8.gguf
    size: "1390.7 MB"
    size_bytes: 1390699680
    sha256: 61aec0de7cfa9246487e309c43508de9c95cf52fd225ce3fada3b4bb4982374e
    tensor_types: 599 F32 + 199 Q8_0
    note: >-
      **Smaller, and it renders a different voice than F32 does** for most
      auto-voice cases and for Description Text -- 2.87 to 12.22 dB of
      long-term average spectrum distance, and a listener heard five of six
      sampled auto-voice pairs as different people while judging the quality of
      both indistinguishable. Not every case moves: the slowest-rate case
      measures 2.87 dB, below the same ~3 dB line this table uses to call F16
      unchanged, so "different voice" is the common outcome rather than a
      universal one.
      Reference Audio cloning is not affected (2.02 / 2.70 dB): it reproduces
      F32's voice. Nothing is disabled, the API is identical, and a Description
      Text prompt is still honored -- "female, young adult, high pitch" gives
      343.5 Hz against F32's 333.3 Hz, so you get a different voice *within* the
      description, not an ignored one. 56.4% smaller, 1811 MiB accelerator
      resident, 1.1-1.4 s to load. Not faster than F32.
    validation:
      ltas_max_db: 12.22 dB
