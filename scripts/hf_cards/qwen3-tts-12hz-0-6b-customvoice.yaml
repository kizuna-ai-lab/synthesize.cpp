    note: >-
      Only the autoregressive half is quantized. The codec's convolutions carry
      the kernel in their fastest dimension -- rows of 7, 16, 3 and 1 -- which no
      block size divides, so it stays at F32. That is 80 per cent of the package
      quantized for a 37 per cent reduction, and synthesis becomes faster than
      real time on the machine this was measured on.
    validation:
      cpu_pcm_cosine: 0.999427
      cuda_pcm_cosine: not_measured
