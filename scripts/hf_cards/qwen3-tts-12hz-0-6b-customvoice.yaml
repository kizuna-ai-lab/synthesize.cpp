summary: |
  A self-contained Qwen3-TTS inference package converted from the official
  12 Hz 0.6B CustomVoice checkpoint. It is an autoregressive talker over a
  residual-vector-quantized codec: a 28-layer Qwen3 decoder emits one semantic
  code per 80 ms frame, a 5-layer code predictor expands it into fifteen
  acoustic codes, and a SEANet decoder turns the finished stream into 24 kHz
  audio. Nine preset Voices ship with it, and the package carries its own
  byte-pair text frontend, so raw UTF-8 text goes in and audio comes out.

capabilities:
  sample_rate_hz: 24000
  voice_count: 9
  voice_ids: preset-catalog
  voice_mode: preset_catalog
  input_kinds:
    - text_utf8
    - token_ids
  frontend_provider: synthesize.qwen_bpe

validation:
  level: port_validated
  # Two different things, deliberately separate. `quality_evaluation` is the
  # automated grid ADR 0017 defers -- no WER, no speaker similarity, no corpus --
  # and it has not run. `listening_audit` is one maintainer checking a small set
  # for obvious regressions, which has. Neither moves the Validation Level.
  quality_evaluation: not_run
  listening_audit: no_obvious_regression
  listening_audit_detail:
    profiles: [F16, Q8_MIXED]
    listeners: 1
    method: blind A/B against the pinned PyTorch reference on replayed codes, plus
      natively-sampled clips on CPU and CUDA where replay cannot reach
    dates: [2026-07-28, 2026-07-29]
    note: >-
      The F16 pass on 2026-07-28 covered eight of the eighteen Golden cases. The
      Q8_MIXED pass on 2026-07-29 covered six natively-sampled pairs and had to be
      run three times: the first used a sampler missing the checkpoint's
      repetition penalty, and the second embedded audio capped at ten seconds,
      which cut the long cases off. Both were found by the listener, not by the
      suite.
  date: 2026-07-29
  reference: the pinned upstream PyTorch implementation at bfloat16 on CUDA
  implementation_revision: workspace-snapshot-2026-07-29
  cases_per_stage: 18
  stages: 3
  # Set explicitly 2026-08-20 (Task 8 fix round, Stage 3 Plan 3): this
  # package's replay methodology replays the ORACLE's own codes through the
  # port's downstream stages (this card's own metric_note, above), so every
  # replayed case's frame count is the oracle's own by construction -- codes
  # replayed cannot desynchronize in length, only in per-sample value.
  replay_duration_exact: true
  columns:
    - key: cpu_pcm_cosine
      title: CPU waveform cosine
    - key: cuda_pcm_cosine
      title: DGX Spark CUDA waveform cosine
  metric_note: |
    Cosine similarity is the measure, not a sample-wise bound, and the codes are
    replayed rather than reproduced. The oracle draws its codes from PyTorch's
    generator and this port from its own seeded stream, so reproducing the same
    codes is neither possible nor the claim: parity replays the oracle's codes
    and compares everything downstream of the draw on identical inputs.

    The deep talker layers carry outlier channels ahead of the final norm — a
    max-abs of 17.4 at layer 27 while cosine holds at 0.99992 — so a sample-wise
    threshold would report catastrophic failure on a correct port. The figure
    quoted is the worst case over the suite. The oracle ran bfloat16 on CUDA and
    the CPU column runs F32, so these cover a dtype and a device difference as
    well as an implementation one.
  # Set explicitly 2026-08-12. This card inherited the generator's old `full`
  # default and so asserted "CUDA placement contained zero executable CPU
  # fallback nodes" -- for this family the plain opposite of what ships. The
  # talker and the code predictor are 59 percent of wall clock and never leave
  # the CPU; `src/arch/qwen3-tts/qwen3-tts.h` states the constraint and
  # `scripts/validate-qwen3-tts-replay.py` fails the run if either places a
  # single node off it. Note the note claims no node totals: unlike OmniVoice's
  # 8,440/880,032 sweep, this family enforces placement relationally per case
  # and publishes no suite-wide counts, so quoting one would be inventing it.
  cuda_placement: partial
  cuda_placement_note: >-
    One of this package's three stages runs on CUDA and two never do. The codec
    is the half that moves, and it gets same-named accelerator-resident twins
    the catalog binds against; the talker and the code predictor stay on the CPU
    on every Execution Backend, because each sampled code is a discrete value
    that conditions the next step and therefore the sequence length, which is
    `docs/backends.md`'s discrete-outputs rule. They get no twins at all -- a
    second copy of 1.8 GB that can never leave the CPU would be read by nothing.
    Together the two held stages are 59 percent of wall clock under the F16
    profile and the codec is the other 41: moving it takes that stage from 8.44
    s to 0.24 s and the end-to-end 37-frame case from 20.69 s to 12.50 s, 35
    times on the stage and 1.66 end to end. The move is checked rather than
    trusted -- the replay validator fails if the talker or the predictor places
    any node off the CPU, or if the codec leaves any node on it -- and six of
    the eight probes stay bit-identical to the CPU stage, with only `audio.pcm`
    moving, in the sixth decimal of its cosine. Suite-wide node totals have not
    been published for this family, so none is quoted here.
  platforms:
    - DGX Spark CPU
    - NVIDIA GB10 CUDA 13.3

publication_note: |
  Both the source and the checkpoint carry an explicit Apache-2.0 grant, so no
  redistribution assumption is required for this variant.

  Only English is declared. The checkpoint also carries codec language tokens for
  German, Spanish, Chinese, Japanese, French, Korean, Russian, Italian and
  Brazilian Portuguese, and two of its nine speakers pin a Chinese dialect; those
  paths load and run, but no language beyond `en` has its own validation cases,
  so none is advertised.

  The speech tokenizer's encoder half is deliberately not carried. Synthesis runs
  one way — codes to audio — so nothing in this package can reach it, and its
  first sixteen codebooks duplicated the decoder's exactly. Dropping it removed
  161 tensors and 225 MB.

usage:
  profile: F16
  voice: aiden
  text: "Qwen3-TTS is awesome!"

