summary: |
  Description-driven voice design, not cloning. Hand it a natural-language
  description of a voice -- pace, pitch, timbre, mood -- and it synthesizes
  text in a voice built from that description; no reference recording is
  ever involved, and none can be supplied. This package catalogues NO preset
  voices: with no Voice Profile supplied, which speaker a request produces
  follows no fixed identity, and the only way to pin one is a Description
  Text Voice Profile.

  That is the structural difference from both siblings shipped so far:
  CustomVoice selects from nine preset voices and cannot design one, and
  Base clones from a reference recording and cannot design one either. This
  is the family's third distinct Voice Profile source, following Reference
  Audio (Base) and the preset catalog (CustomVoice).

capabilities:
  sample_rate_hz: 24000
  voice_count: 0
  voice_mode: seed_default_with_profiles
  voice_profile_sources:
    - description_text
  input_kinds:
    - text_utf8
  frontend_provider: synthesize.qwen_bpe

validation:
  # `level: port_validated` KEPT, on jiangzhuo's ruling of 2026-08-20, after
  # PR #16's review raised whether this variant's partial measurement earns
  # the level at all. The ruling: keep the level, and make the scope
  # impossible to miss on the rendered card. `metric_note` below carries
  # that disclosure, quoting the tolerance ledger's own
  # `partial-measurement-prefill-and-public-only` label verbatim, and it
  # renders directly beneath the validation table rather than at the bottom
  # of the card.
  #
  # THE BASIS, STATED HONESTLY: this level has been used family-wide to mean
  # "validated to the recorded depth, with the depth published beside it,"
  # not "validated to a fixed uniform depth." Base shipped `port_validated`
  # without a full waveform replay of its own weights -- its tolerance entry
  # reads `partial-measurement-conditioning-path-only`, and its replay stage
  # carries only x-vector and ICL-prompt probes. This variant is thinner
  # still (prefill and public seam only), and that difference is exactly
  # what the disclosure exists to publish. A reader who wants the level to
  # mean a uniform depth will not get it from this project's history; a
  # reader who reads the level together with the scope paragraph gets an
  # accurate picture. That is the trade the ruling makes, deliberately.
  level: port_validated
  date: 2026-08-20
  reference: the pinned upstream PyTorch implementation at bfloat16 on CUDA
  platforms:
    - DGX Spark CPU
    - NVIDIA GB10 CUDA 13.3
  # This variant's evidence is a THIRD kind, neither CustomVoice's replayed-
  # code cosine nor Base's x-vector cosine. No per-case Golden oracle
  # artifacts exist for this variant yet (Plan 3 Task 2's finding: all 13
  # manifest cases are skipped by the ordinary replay loop for missing
  # oracle payloads), so what is measured instead is a prefill-embedding
  # relative-error probe against the pinned bfloat16 oracle, on the two
  # description-instruct cases (empty and non-empty) every other cell below
  # also uses, plus the family-wide public-seam relation set and CPU RTF.
  cases_per_stage: 2
  stages: 2
  cuda_placement: partial
  cuda_placement_note: >-
    This variant introduces no new graphs of its own -- no reference-audio
    path, so no speaker or codec encoder to place -- so there is no
    placement decision here beyond the one Stage 1 already made: the codec
    decoder runs on the device and the autoregressive half (talker and code
    predictor) stays on the CPU under the discrete-outputs rule, because a
    sampled codec token conditions the next step and the sequence length
    itself. Measured end to end on this variant's own fixed workload, CUDA
    buys 6.16% (18.9220s to 17.7564s, RTF 4.6377 to 4.3520, BF16, n=8
    medians) -- narrower than the Base variant's own 6.47%/6.35%, in the
    direction a 3.2x larger talker predicts. The `replay` stage's prefill
    probe never touches CUDA: its driver hardcodes the CPU device, and only
    `codec.decoder.`-prefixed tensors are mirrored to the GPU at all, so the
    talker has no device-side weights to run against regardless. No CUDA
    sub-grid is committed in the tolerance file, for that same structural
    reason -- matching the Base variant's own declined sub-grid, not a new
    omission.
  columns:
    - key: public_seam_checks
      title: Public-seam checks
    - key: replay_prefill_headroom
      title: Replay prefill headroom (0.01 bound)
    - key: cpu_rtf
      title: CPU real-time factor
  metric_note: |
    **SCOPE OF MEASUREMENT: `partial-measurement-prefill-and-public-only`.**
    That is the status this package's own tolerance ledger
    (`tests/tolerances/qwen3-tts.json`) carries for it, quoted verbatim so
    the card and the ledger say the same words. It means what it says, and
    what it excludes matters as much as what it covers.

    WHAT WAS RUN, per profile, for all four shipped profiles: the
    talker-prefill embedding probe against the pinned bfloat16 oracle on two
    description-instruct cases (one empty, one non-empty), reported above as
    replay prefill headroom; and the family-wide public-seam relation set,
    reported above as public-seam checks. Both columns are per-profile and
    every shipped profile has its own measured cell.

    WHAT WAS NOT RUN: everything else. This variant's Golden Manifest
    declares thirteen Port Validation Cases, and **none of them carries an
    oracle payload** -- the ordinary replay loop skips every one of the
    thirteen, at every profile, for missing oracle artifacts. No comparison
    of generated codes has run. No comparison of output waveform against the
    oracle has run. There is no per-case audio evidence for this package of
    any kind. The eleven manifest cases beyond the two prefill cases are
    committed CONTRACT, not committed MEASUREMENT.

    The `validation_level: port_validated` at the head of this section is
    the family's own long-standing reading of that level -- validated to the
    recorded depth, with the depth published beside it -- and this paragraph
    is that depth. Read the level and this scope together; neither is
    complete without the other.

    THREE COLUMNS FOR A THIRD KIND OF EVIDENCE. `Public-seam checks` counts
    the same family-wide behavioural relations Base's and CustomVoice's
    cards count: a named seed reproduces byte for byte, a different seed and
    a different Voice both change the audio, the resolved language is
    reported, and so on. Three of the family-wide set are structurally
    inapplicable here and counted as skipped rather than passed: a
    Description Text Voice Profile has no id for the seam to echo, and two
    further checks need a preset "dialect" Voice this package does not
    catalogue.

    `Replay prefill headroom` is the committed 0.01 `max_relative` bound
    divided by the worse of two measured p95-relative-error cases (an empty
    and a non-empty description instruct), comparing this port's assembled
    talker input embeddings against the pinned bfloat16 oracle's own. Above
    1.0x clears the gate; below 1.0x fails it. This is a PREFILL comparison
    only -- no per-case codes or waveform oracle exists for this variant yet
    -- and it is not evidence about synthesized audio quality by itself.

    `CPU real-time factor` is synthesis time over the audio produced, each
    row measured on its own output length, on a Release-typed build
    (`build/rel-dgx-spark`). Below 1.0 is faster than real time. Rows are
    never compared by dividing one RTF by another's wall clock -- the three
    profiles stop at different frame counts, a property of their weights,
    the same autoregressive-stop-decision mechanism that moves this family's
    generated length between builds. BF16's row is a later, paired
    re-measurement (n=8, taken alongside the CUDA run above) rather than
    this task's own first pass (n=3, RTF 4.73) -- both are real, and the
    later one is what this card carries, per the family record's own
    forward pointer between them.
  # Two different things, deliberately separate. `quality_evaluation` is the
  # automated grid ADR 0017 defers -- no WER, no speaker similarity, no
  # corpus -- and it has not run. `listening_audit` is one maintainer
  # checking a small set for obvious regressions, which has. Neither moves
  # the Validation Level.
  quality_evaluation: not_run
  listening_audit: no_obvious_regression
  listening_audit_detail:
    profiles: [BF16, F16, Q8_MIXED, Q5_K_MIXED]
    listeners: 1
    method: >-
      blind A/B on natively-sampled clips for the quantization half, and a
      LABELLED comparison for the description-control half, which is weak
      evidence and is recorded as weak
    dates: [2026-08-20]
    note: >-
      Four blind pairs (BF16 vs F16, BF16 vs Q8_MIXED, BF16 vs Q5_K_MIXED,
      BF16 CPU vs CUDA), all judged indistinguishable, every pair confirmed
      to differ in bytes before anyone listened. Q5_K_MIXED -- which fails
      its own replay-stage tolerance gate roughly 3x over the committed 0.01
      bound (both measured cases) -- was included in the blind half by
      jiangzhuo's ruling and was indistinguishable from BF16 on this one
      clip: a data point about the gate's conservatism at this margin, on
      one clip, one seed, one listener, and not a recalibration of the
      bound. This note read "it does not by itself change the do-not-publish
      recommendation for that profile" until later the same day, when
      jiangzhuo ruled on this audit that the profile ships; the audit did
      not change by itself, a decision was taken on it. The profile is now
      published with its gate failure disclosed -- see `downloads_note`.
      A separate, labelled description-control half (same sentence and
      seed, two contrasting descriptions) returned "yes, in the described
      direction" -- weak evidence by design, recorded as weak. Quality
      Evaluation stays deferred per ADR 0017 and neither half moves the
      Validation Level.

publication_note: |
  Both the pinned source at `022e286b` and the checkpoint at `5ecdb673` carry
  an explicit Apache-2.0 grant, so no redistribution assumption is required
  for this variant.

  Only English is declared. The checkpoint carries the same codec language
  tokens the rest of the family does, but no case in this variant's own
  validation record exercises a language beyond `en`, so none beyond `en` is
  advertised here -- the same caution CustomVoice's own card already takes.

  **Published 2026-08-21** to `jiangzhuo9357/qwen3-tts-12hz-1-7b-voicedesign-gguf`
  (commit `0dcbe6df83b1`), after jiangzhuo's explicit per-act confirmation.
  The four GGUFs' LFS sha256 oids were verified remotely against the digests
  above after the upload landed. This paragraph said "prepared and has not
  been uploaded" until the same day; the digests above were computed against those
  exact files. Nothing has been pushed to `{{ target_repo }}` or anywhere
  else, and publication is a separate outward act requiring jiangzhuo's
  explicit, per-act confirmation naming the target repository. The
  2026-08-20 ruling that `Q5_K_MIXED` belongs on the roster decided WHICH
  profiles this card describes; it is not itself an authorization to upload
  anything.

usage:
  profile: Q8_MIXED
  text: "Qwen3-TTS is awesome!"

downloads_note: >-
  **`Q5_K_MIXED` FAILS A COMMITTED ACCURACY GATE AND IS PUBLISHED ANYWAY.
  Read both halves of that sentence before choosing it.** It is the fourth
  row above, and it is the only profile in this project shipped over a
  numerical gate failure.


  **The breach, measured.** Its `replay`-stage prefill probe exceeds the
  committed 0.01 `max_relative` bound on both measured cases -- 0.031029
  (empty instruct) and 0.030366 (non-empty instruct), roughly 3.10x and
  3.04x over, headroom 0.32x. That is a real gate failure, not a thinner
  margin: the other three profiles clear the same bound at 3.44x (`BF16`),
  3.45x (`F16`) and 1.63x (`Q8_MIXED`). The `public` stage's own
  `all_passed` reads false for this profile too -- 10 of its 11 non-skipped
  checks pass, the one failure being the prefill-tolerance relation itself.
  The measurement has not been revised, reweighted or recalibrated, and the
  tolerance ledger still records `gate_passed: false` for this cell, because
  that remains true.


  **The decision, and who made it.** jiangzhuo ruled on 2026-08-20 that this
  profile ships, after the blind half of that day's listening audit found it
  indistinguishable from `BF16`. The audit's strength is exactly this: one
  clip, one sentence, one seed, one listener. `Q5_K_MIXED` was included
  unlabelled among the other three pairs (`BF16` vs `F16`, `BF16` vs
  `Q8_MIXED`, `BF16` CPU vs CUDA), A/B positions shuffled from a recorded
  seed (20260820), every pair confirmed to differ in bytes before anyone
  listened. A separate, labelled description-control pass returned "yes, in
  the described direction" -- weak evidence by design, recorded as weak, and
  it does not bear on this profile at all.


  **What that does and does not mean.** It is a data point about this gate's
  conservatism at this margin, on one clip. It is not a recalibration of the
  bound, not a Quality Evaluation (still deferred, ADR 0017), and not a
  general finding that a 3x breach of this probe is inaudible. A reader who
  needs numerical fidelity to the reference should choose `Q8_MIXED`, which
  clears the same gate at 1.63x and is 40.36% larger (2,499,423,680 against 1,780,723,136 bytes; equivalently, Q5_K_MIXED is 28.75% smaller than it). A reader who wants the
  smallest package and accepts a disclosed, unresolved numerical breach on
  one listener's word can choose this one. See `docs/quantization.md`'s
  "VoiceDesign's Q5_K_MIXED" section for the full arithmetic, Task 4's
  original do-not-publish recommendation kept as history, and the dated
  note recording that this ruling supersedes it.

