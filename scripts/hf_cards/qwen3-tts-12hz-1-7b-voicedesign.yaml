    note: >-
      The smallest profile that CLEARS its accuracy gate, and the fastest of
      the four -- 41.82% smaller than BF16 at RTF 1.05 -- with the thinnest
      passing replay headroom, 1.63x against BF16's 3.44x and F16's 3.45x,
      still comfortably above the 0.01 bound. Blind-indistinguishable from
      BF16 in the 2026-08-20 listening audit. **This is the recommended
      choice for anyone who wants numerical fidelity to the reference at a
      reduced size**; Q5_K_MIXED below is smaller but does not clear the
