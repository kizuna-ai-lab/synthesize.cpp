# longer supplies the measured-and-not-shipped precedent that open item once
# pointed at, because this card no longer has an unshipped profile.
#
# Publication is a separate outward act that requires jiangzhuo's explicit,
# per-act confirmation naming the target repository. This file prepares the
# artifact description; it does not authorize uploading anything, and
# nothing described here has been pushed to `target_repo` or anywhere else.

