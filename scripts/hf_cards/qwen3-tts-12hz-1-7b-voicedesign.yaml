summary: |
  Description-driven voice design, not cloning. Hand it a natural-language
  description of a voice -- pace, pitch, timbre, mood -- and it synthesizes
  text in a voice built from that description; no reference recording is
  ever involved, and none can be supplied. This package catalogues NO preset
  voices: with no Voice Profile supplied, which speaker a request produces
  follows no fixed identity, and the only way to pin one is a Description
  Text Voice Profile.

  That is the structural difference from both siblings shipped so far:
  CustomVoice selects from nine preset voices and cannot design one, and
  Base clones from a reference recording and cannot design one either. This
  is the family's third distinct Voice Profile source, following Reference
  Audio (Base) and the preset catalog (CustomVoice).

capabilities:
  sample_rate_hz: 24000
  voice_count: 0
  voice_mode: seed_default_with_profiles
  voice_profile_sources:
    - description_text
  input_kinds:
    - text_utf8
  frontend_provider: synthesize.qwen_bpe

validation:
  level: port_validated
  date: 2026-08-20
  reference: the pinned upstream PyTorch implementation at bfloat16 on CUDA
  platforms:
    - DGX Spark CPU
    - NVIDIA GB10 CUDA 13.3
  # This variant's evidence is a THIRD kind, neither CustomVoice's replayed-
  # code cosine nor Base's x-vector cosine. No per-case Golden oracle
  # artifacts exist for this variant yet (Plan 3 Task 2's finding: all 13
  # manifest cases are skipped by the ordinary replay loop for missing
  # oracle payloads), so what is measured instead is a prefill-embedding
  # relative-error probe against the pinned bfloat16 oracle, on the two
  # description-instruct cases (empty and non-empty) every other cell below
  # also uses, plus the family-wide public-seam relation set and CPU RTF.
  cases_per_stage: 2
  stages: 2
  cuda_placement: partial
  cuda_placement_note: >-
    This variant introduces no new graphs of its own -- no reference-audio
    path, so no speaker or codec encoder to place -- so there is no
    placement decision here beyond the one Stage 1 already made: the codec
    decoder runs on the device and the autoregressive half (talker and code
    predictor) stays on the CPU under the discrete-outputs rule, because a
    sampled codec token conditions the next step and the sequence length
    itself. Measured end to end on this variant's own fixed workload, CUDA
    buys 6.16% (18.9220s to 17.7564s, RTF 4.6377 to 4.3520, BF16, n=8
    medians) -- narrower than the Base variant's own 6.47%/6.35%, in the
    direction a 3.2x larger talker predicts. The `replay` stage's prefill
    probe never touches CUDA: its driver hardcodes the CPU device, and only
    `codec.decoder.`-prefixed tensors are mirrored to the GPU at all, so the
    talker has no device-side weights to run against regardless. No CUDA
    sub-grid is committed in the tolerance file, for that same structural
    reason -- matching the Base variant's own declined sub-grid, not a new
    omission.
  columns:
    - key: public_seam_checks
      title: Public-seam checks
    - key: replay_prefill_headroom
      title: Replay prefill headroom (0.01 bound)
    - key: cpu_rtf
      title: CPU real-time factor
  metric_note: |
    THREE COLUMNS FOR A THIRD KIND OF EVIDENCE. `Public-seam checks` counts
    the same family-wide behavioural relations Base's and CustomVoice's
    cards count: a named seed reproduces byte for byte, a different seed and
    a different Voice both change the audio, the resolved language is
    reported, and so on. Three of the family-wide set are structurally
    inapplicable here and counted as skipped rather than passed: a
    Description Text Voice Profile has no id for the seam to echo, and two
    further checks need a preset "dialect" Voice this package does not
    catalogue.

    `Replay prefill headroom` is the committed 0.01 `max_relative` bound
    divided by the worse of two measured p95-relative-error cases (an empty
    and a non-empty description instruct), comparing this port's assembled
    talker input embeddings against the pinned bfloat16 oracle's own. Above
    1.0x clears the gate; below 1.0x fails it. This is a PREFILL comparison
    only -- no per-case codes or waveform oracle exists for this variant yet
    -- and it is not evidence about synthesized audio quality by itself.

    `CPU real-time factor` is synthesis time over the audio produced, each
    row measured on its own output length, on a Release-typed build
    (`build/rel-dgx-spark`). Below 1.0 is faster than real time. Rows are
    never compared by dividing one RTF by another's wall clock -- the three
    profiles stop at different frame counts, a property of their weights,
    the same autoregressive-stop-decision mechanism that moves this family's
    generated length between builds. BF16's row is a later, paired
    re-measurement (n=8, taken alongside the CUDA run above) rather than
    this task's own first pass (n=3, RTF 4.73) -- both are real, and the
    later one is what this card carries, per the family record's own
    forward pointer between them.
  # Two different things, deliberately separate. `quality_evaluation` is the
  # automated grid ADR 0017 defers -- no WER, no speaker similarity, no
  # corpus -- and it has not run. `listening_audit` is one maintainer
  # checking a small set for obvious regressions, which has. Neither moves
  # the Validation Level.
  quality_evaluation: not_run
  listening_audit: no_obvious_regression
  listening_audit_detail:
    profiles: [BF16, F16, Q8_MIXED, Q5_K_MIXED]
    listeners: 1
    method: >-
      blind A/B on natively-sampled clips for the quantization half, and a
      LABELLED comparison for the description-control half, which is weak
      evidence and is recorded as weak
    dates: [2026-08-20]
    note: >-
      Four blind pairs (BF16 vs F16, BF16 vs Q8_MIXED, BF16 vs Q5_K_MIXED,
      BF16 CPU vs CUDA), all judged indistinguishable, every pair confirmed
      to differ in bytes before anyone listened. Q5_K_MIXED -- which fails
      its own replay-stage tolerance gate roughly 3x over the committed 0.01
      bound (both measured cases) -- was included in the blind half by
      jiangzhuo's ruling and was indistinguishable from BF16 on this one
      clip: a data point about the gate's conservatism at this margin, on
      one clip, one seed, one listener, not a recalibration, and it does not
      by itself change the do-not-publish recommendation for that profile.
      A separate, labelled description-control half (same sentence and
      seed, two contrasting descriptions) returned "yes, in the described
      direction" -- weak evidence by design, recorded as weak. Quality
      Evaluation stays deferred per ADR 0017 and neither half moves the
      Validation Level.

publication_note: |
  Both the pinned source at `022e286b` and the checkpoint at `5ecdb673` carry
  an explicit Apache-2.0 grant, so no redistribution assumption is required
  for this variant.

  Only English is declared. The checkpoint carries the same codec language
  tokens the rest of the family does, but no case in this variant's own
  validation record exercises a language beyond `en`, so none beyond `en` is
  advertised here -- the same caution CustomVoice's own card already takes.

  **This card is prepared and has not been uploaded.** The three GGUFs it
  describes exist locally; their digests below were computed against those
  exact files. Nothing has been pushed to `{{ target_repo }}` or anywhere
  else, and publication is a separate outward act requiring jiangzhuo's
  explicit, per-act confirmation naming the target repository.

usage:
  profile: Q8_MIXED
  text: "Qwen3-TTS is awesome!"

downloads_note: >-
  **A fourth profile, `Q5_K_MIXED`, was cut and measured and is NOT published
  here.** At 1,780,723,136 bytes it is 28.75% smaller than `Q8_MIXED`, but its
  `replay`-stage prefill probe exceeds the committed 0.01 `max_relative` bound
  on both measured cases (0.031029 and 0.030366, roughly 3x over, headroom
  0.32x) -- a real gate failure, not a thinner margin. It loads and
  synthesizes through the public seam (`synth_model_load` and
  `synth_voice_profile_create_from_description` both succeed against it), and
  a 2026-08-20 blind listening pass could not distinguish it from `BF16` on
  one clip, one seed, one listener -- evidence about the gate's conservatism
  at this margin, not a basis for shipping it. See `docs/quantization.md`'s
  "VoiceDesign's Q5_K_MIXED" section for the full arithmetic and the
  recommendation, and this card's own `listening_audit_detail` above for the
  audit record.

