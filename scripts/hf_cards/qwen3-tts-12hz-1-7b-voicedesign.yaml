# three shipped profiles below (BF16, F16, Q8_MIXED) and a fourth,
# Q5_K_MIXED, which fails its own replay-stage tolerance gate roughly 3x
# over the committed bound and is recorded here as measured-and-not-shipped
# rather than omitted -- see the Downloads section below and
