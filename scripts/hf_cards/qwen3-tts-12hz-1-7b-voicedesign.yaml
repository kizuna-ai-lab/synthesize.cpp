  - name: Q5_K_MIXED
    filename: qwen3-tts-12hz-1-7b-voicedesign-Q5_K_MIXED.gguf
    size: 1698.2 MB
    size_bytes: 1780723136
    sha256: a47479d90a61a32e7b2fb5f6b8bd3d47405aac1cc98cf278ab3fc0c2d1c282bb
    tensor_types: 267 Q5_K + 392 F32
    # `gate_passed: false` is the tolerance ledger's own verdict for this
    # cell (tests/tolerances/qwen3-tts.json) and it is recorded here as
    # data. The template renders only the three declared `validation.columns`
    # keys, so this line does NOT reach the card by itself -- the gate
    # failure is carried into the render three ways instead: the headroom
    # column below says FAILS in words, the public-seam column reports the
    # failing check, and `downloads_note` states the breach and the ruling
    # together in the Downloads section. A field the template ignores is a
