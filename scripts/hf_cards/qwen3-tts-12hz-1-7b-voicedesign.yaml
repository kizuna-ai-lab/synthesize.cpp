    tensor_types: 267 F16 + 392 F32
    note: >-
      LARGER than the BF16 source by 283,136 bytes (0.0066%) -- both are
      two-byte types, so the matrix weights do not shrink while the
      sensitive tensors widen BF16 to F32, the same shape Base's own F16
      shows. F16 is a speed profile for this family, not a size one: on the
      aarch64/GB10 host this was measured on, ggml's CPU backend has a
      NEON-vectorized GEMM path for F16 and none for BF16, so F16 measures
      roughly 2.8x faster (RTF against BF16's own 4.64 row above, both from
      this table) for a package that costs nothing measurable on accuracy
      (replay headroom 3.45x, next to BF16's own 3.44x). The task that first
      measured this pairing computed 2.87x against BF16's earlier n=3 pass
      (RTF 4.73); recomputed against this table's own later n=8 BF16 row,
      it is 2.81x -- both real numbers from the same tree, and neither is a
      cross-platform constant.
    validation:
      public_seam_checks: 11 passed, 3 skipped as inapplicable
      replay_prefill_headroom: 3.45x
      cpu_rtf: 1.65
  - name: Q8_MIXED
    filename: qwen3-tts-12hz-1-7b-voicedesign-Q8_MIXED.gguf
    size: 2383.6 MB
    size_bytes: 2499423680
    sha256: f8540471d2d7a9b353bd5c6d165e9caaf9bed3b90a20a4ec8fe410f993fdf92a
