# profiles, and all four ship: BF16, F16, Q8_MIXED and Q5_K_MIXED.
#
# Q5_K_MIXED FAILS ITS OWN REPLAY-STAGE TOLERANCE GATE and is published
# anyway, on jiangzhuo's explicit ruling of 2026-08-20 after the blind
# listening audit found it indistinguishable from BF16. Both facts belong to
# a reader at once and the Downloads section states them together. This
# supersedes Task 4's "do not publish" recommendation, which STAYS in
# `docs/quantization.md` as history under this file's family convention of
# superseding rather than rewriting; see that document's "VoiceDesign's
# Q5_K_MIXED" section for the full arithmetic and the dated closure.
#
# This is the project's FIRST profile published despite failing a committed
# numerical gate. The shape this card establishes is therefore
# published-despite-gate-failure-with-the-breach-disclosed, NOT the
# measured-and-not-shipped shape an earlier draft of this file claimed to
# establish. `qwen3-tts-12hz-0-6b-customvoice.yaml`'s own Q5_K_MIXED remains
# silently absent from its card rather than named -- still a gap, still
# tracked, and NOT fixed here (see `docs/porting/families/qwen3-tts.md`'s
