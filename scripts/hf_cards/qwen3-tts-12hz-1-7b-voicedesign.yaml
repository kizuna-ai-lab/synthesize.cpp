      bound -- roughly 3x over, headroom 0.32x. The measurement stands as
      measured; only the publication decision changed. Choose Q8_MIXED
      instead if you need the gate cleared. See the note under the table.
    validation:
      public_seam_checks: 10 passed, 1 FAILED (prefill tolerance), 3 skipped as inapplicable
      replay_prefill_headroom: 0.32x — FAILS the 0.01 bound
      cpu_rtf: 1.08
