summary: |
  A self-contained 109-speaker VITS inference package converted from the
  official VCTK checkpoint. It supports CPU and CUDA execution through the same
  public library interface and exposes stable Voice IDs from `speaker-000`
  through `speaker-108`.

capabilities:
  sample_rate_hz: 22050
  voice_count: 109
  voice_ids: speaker-000..speaker-108
  voice_mode: preset_catalog
  input_kinds:
    - phonemes_utf8
    - token_ids
  frontend_provider: synthesize.symbol_map

validation:
  level: port_validated
  quality_evaluation: not_run
  date: 2026-07-27
  reference: the pinned upstream PyTorch implementation
  implementation_revision: workspace-snapshot-2026-07-27
  cases_per_stage: 12
  stages: 7
  columns:
    - key: cpu_pcm_max_abs
      title: CPU max PCM drift
    - key: dgx_pcm_max_abs
      title: DGX Spark CUDA max PCM drift
  metric_note: |
    Drift is the largest absolute difference between one PCM sample and the
    reference's.
  platforms:
    - DGX Spark CPU
    - NVIDIA GB10 CUDA 13.3

publication_note: |
  The synthesize.cpp maintainer has chosen to publish these converted artifacts
  on the explicit project-policy assumption that the absence of separate
  checkpoint terms imposes no additional redistribution restriction. Users who
  require a different legal interpretation should review the upstream source
  and checkpoint provenance before redistribution.

usage:
  profile: F16
  voice: speaker-004
  phonemes: "ˈeɪ."

