summary: |
  A self-contained 109-speaker VITS inference package converted from the
  official VCTK checkpoint. It supports CPU and CUDA execution through the same
  public library interface and exposes stable Voice IDs from `speaker-000`
  through `speaker-108`.

capabilities:
  sample_rate_hz: 22050
  voice_count: 109
  voice_ids: speaker-000..speaker-108
  voice_mode: preset_catalog
  input_kinds:
    - phonemes_utf8
    - token_ids
  frontend_provider: synthesize.symbol_map

validation:
  level: port_validated
  quality_evaluation: not_run
  date: 2026-07-27
  reference: the pinned upstream PyTorch implementation
  implementation_revision: workspace-snapshot-2026-07-27
  cases_per_stage: 12
  stages: 7
  columns:
    - key: cpu_pcm_max_abs
      title: CPU max PCM drift
    - key: dgx_pcm_max_abs
      title: DGX Spark CUDA max PCM drift
  metric_note: |
    Drift is the largest absolute difference between one PCM sample and the
    reference's.
  # Set explicitly 2026-08-12, for the same reason as `vits-ljspeech.yaml`:
  # this card inherited the generator's old `full` default and asserted zero
  # executable CPU fallback. The measurement behind that sentence predates
  # `df1351e` (2026-07-26), which moved this family's text encoder and duration
  # predictor onto CPU. See that spec's comment for the full account.
  cuda_placement: partial
  cuda_placement_note: >-
    Two of this family's stages run on CPU on every Execution Backend, and the
    other five run on CUDA when CUDA is the selected Execution Backend.
    `Model::Impl::compute_duration_stage` uses a
    CPU-only scheduler over CPU-resident mirrors of the text encoder, the
    duration predictor and the Voice tensors, because the duration path ceils
    its logits into an integer frame count and every later stage's shape
    follows from that integer. Removing the strict-FP32 gate made it
    backend-dependent: on the 315-token `ljs-long` case CUDA ceiled one token
    differently and moved the frame count by 256 samples. The text encoder is
    held too, not just the rounding stage, because the duration stage re-runs
    it and feeds its output straight into the predictor. 27.5 of the model's
    113.2 MB are consequently resident in both buffers, and synthesis wall time
    on the family's longest case rises from 1.09 s to 1.39 s, still 7.6 times
    faster than real time. In exchange the frame counts match CPU exactly --
    156,416 for `vctk-long` -- and both variants report `structural_exact` on
    all twelve CUDA cases. This is a deliberate placement, not a fallback: no
    node falls back to CPU inside a CUDA graph.
  platforms:
    - DGX Spark CPU
    - NVIDIA GB10 CUDA 13.3

publication_note: |
  The synthesize.cpp maintainer has chosen to publish these converted artifacts
  on the explicit project-policy assumption that the absence of separate
  checkpoint terms imposes no additional redistribution restriction. Users who
  require a different legal interpretation should review the upstream source
  and checkpoint provenance before redistribution.

usage:
  profile: F16
  voice: speaker-004
  phonemes: "ˈeɪ."

